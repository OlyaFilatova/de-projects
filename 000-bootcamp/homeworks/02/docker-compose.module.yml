services:
  # ==========================================================
  # KESTRA POSTGRES
  # ==========================================================

  dezm2_kestra_postgres:
    image: postgres:18
    volumes:
      - kestra_postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${KESTRA_POSTGRES_USER}
      POSTGRES_PASSWORD: ${KESTRA_POSTGRES_PASSWORD}
      POSTGRES_DB: ${KESTRA_POSTGRES_DB}
    
    ports:
      - "5433:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${KESTRA_POSTGRES_USER} -d ${KESTRA_POSTGRES_DB}"
        ]
      interval: 30s
      timeout: 10s
      retries: 10

    networks:
      - module_follow

  dezm2_localstack:
    image: localstack/localstack:4.10

    ports:
      - "4566:4566"

    environment:
      SERVICES: s3
      DEBUG: "0"
      PERSISTENCE: "1"
      AWS_DEFAULT_REGION: us-east-1

    volumes:
      - localstack_data:/var/lib/localstack
      - ./localstack/init:/etc/localstack/init/ready.d
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      module_follow:
        aliases:
          - localhost.localstack.cloud


  # ==========================================================
  # KESTRA
  # ==========================================================

  dezm2_kestra:
    image: kestra/kestra:v1.1
    pull_policy: always
    # Note that this setup with a root user is intended for development purpose.
    # Our base image runs without root, but the Docker Compose implementation needs root to access the Docker socket
    # To run Kestra in a rootless mode in production, see: https://kestra.io/docs/installation/podman-compose
    user: "root"
    command: server standalone
    volumes:
      - kestra_data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - kestra_tmp:/tmp/kestra-wd
    environment:
      ENV_POSTGRES_USER: ${POSTGRES_USER}
      ENV_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ENV_POSTGRES_DB: ${POSTGRES_DB}
      ENV_POSTGRES_HOST: dezm2_postgres
      ENV_POSTGRES_PORT: ${POSTGRES_PORT}
      ENV_AWS_ACCESS_KEY_ID: ${SECRET_AWS_ACCESS_KEY_ID}
      ENV_AWS_SECRET_KEY_ID: ${SECRET_AWS_SECRET_KEY_ID}
      ENV_AWS_ENDPOINT: 'http://localhost.localstack.cloud:4566'
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://dezm2_kestra_postgres:5432/${KESTRA_POSTGRES_DB}
            driverClassName: org.postgresql.Driver
            username: ${KESTRA_POSTGRES_USER}
            password: ${KESTRA_POSTGRES_PASSWORD}
        kestra:
          variables:
            env-vars-prefix: "ENV_"
          server:
            basicAuth:
              username: ${KESTRA_USERNAME}
              password: ${KESTRA_PASSWORD}
          repository:
            type: postgres
          storage:
            type: local
            local:
              basePath: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmpDir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:8080/
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      dezm2_kestra_postgres:
        condition: service_started

    networks:
      - module_follow

  # ==========================================================
  # POSTGRES
  # orchestrated database
  # ==========================================================

  dezm2_postgres:
    image: postgres:18

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    
    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    networks:
      - module_follow

    depends_on:
      dezm2_kestra:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 30s
      timeout: 10s
      retries: 10

  # ==========================================================
  # PGADMIN
  # ==========================================================

  dezm2_pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8082:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - dezm2_postgres
    restart: unless-stopped

    networks:
      - module_follow

# ==========================================================
# NETWORK
# ==========================================================

networks:
  module_follow:
    driver: bridge


# ==========================================================
# PERSISTENT VOLUMES
# ==========================================================

volumes:
  postgres_data:
  pgadmin_data:
  kestra_postgres_data:
  kestra_data:
  kestra_tmp:
  localstack_data:
