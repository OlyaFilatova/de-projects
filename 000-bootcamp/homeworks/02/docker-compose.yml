  #   container_name: module_1_0

  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #     POSTGRES_DB: ${POSTGRES_DB}
  #     POSTGRES_HOST: postgres
  #     POSTGRES_PORT: ${POSTGRES_PORT}

  #   depends_on:
  #     postgres:
  #       condition: service_healthy

  #   networks:
  #     - homework

  # # ==========================================================
  # # HOMEWORKS
  # # ==========================================================

# ==========================================================
# NETWORK
# ==========================================================

networks:
  homework:
    driver: bridge


# ==========================================================
# PERSISTENT VOLUMES
# ==========================================================

volumes:
  postgres_data:
  pgadmin_data:
  kestra_postgres_data:
  kestra_data:
  kestra_tmp:
