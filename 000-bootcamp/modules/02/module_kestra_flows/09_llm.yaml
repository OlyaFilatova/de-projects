id: 09_chat_without_rag
namespace: module_follow

description: |
  Query LLM without RAG.

tasks:
  - id: chat_without_rag
    type: io.kestra.plugin.ai.completion.ChatCompletion
    description: Query about Kestra 1.1 features WITHOUT RAG
    provider:
      type: io.kestra.plugin.ai.provider.Ollama
      modelName: qwen3:8b
      endpoint: http://host.docker.internal:11434
    configuration:
      thinkingEnabled: true
      returnThinking: true
    messages:
      - type: USER
        content: |
          Which features were released in Kestra 1.1? 
          Please list at least 5 major features with brief descriptions.

  - id: log_results
    type: io.kestra.plugin.core.log.Log
    message: |
      Reponse without RAG: {{ outputs.chat_without_rag.textOutput }}
